version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: commerce-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_pass}
      POSTGRES_DB: ${POSTGRES_DB:-commerce_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - commerce-network

  redis:
    image: redis:7-alpine
    container_name: commerce-cache
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - commerce-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commerce-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-commerce_user}:${POSTGRES_PASSWORD:-commerce_pass}@postgres:5432/${POSTGRES_DB:-commerce_db}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - commerce-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: commerce-web
    restart: unless-stopped
    ports:
      - '5173:5173'
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - commerce-network

volumes:
  postgres_data:
  redis_data:

networks:
  commerce-network:
    driver: bridge
